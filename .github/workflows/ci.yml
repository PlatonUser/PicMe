name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required AI-SDLC artefacts
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PROJECT.md
          test -f docs/TASKS.md
          test -f docs/specs/UC-TEMPLATE.md
          test -f .github/copilot-instructions.md
          test -d skills
          test -d .devcontainer

      - name: Check whitespace errors
        run: git diff --check

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Python version
        id: pyver
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q tests/unit

      - name: Integration tests
        run: pytest -q tests/integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t picme:ci .

      - name: Start Docker container
        run: docker run -d --name picme-e2e -p 8001:8000 -e DATABASE_URL=sqlite:///./e2e.db picme:ci

      - name: Wait for health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Read Python version
        id: pyver
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run E2E tests
        env:
          BASE_URL: http://127.0.0.1:8001
        run: pytest -q tests/e2e

      - name: Print container logs
        if: always()
        run: docker logs picme-e2e

      - name: Remove Docker container
        if: always()
        run: docker rm -f picme-e2e
