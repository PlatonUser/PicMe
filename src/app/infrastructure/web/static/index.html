<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PicMe</title>
  <style>
    :root { color-scheme: dark; --bg: #10131a; --panel: #1b2130; --text: #f7f8fb; --muted: #b9c1d1; --accent: #ffd447; --line: #46516a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 20px/1.4 system-ui, sans-serif; }
    main { display: grid; min-height: 100vh; width: min(720px, 92vw); margin: 0 auto; align-content: center; padding: 32px 0; }
    .panel { padding: clamp(28px, 7vw, 56px); background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
    .center { text-align: center; }
    h1, p { margin: 0 0 18px; }
    h1 { color: var(--accent); font-size: clamp(4rem, 16vw, 8rem); line-height: .95; letter-spacing: .03em; }
    p { color: var(--muted); font-size: clamp(1.1rem, 3vw, 1.4rem); }
    .actions { display: grid; gap: 14px; margin-top: 34px; }
    a { display: block; min-height: 64px; padding: 14px 18px; border: 2px solid var(--accent); border-radius: 12px; background: var(--accent); color: #17130a; font: inherit; font-weight: 800; line-height: 1.4; text-decoration: none; }
    a:hover { filter: brightness(1.08); }
    a.secondary { border-color: var(--line); background: transparent; color: var(--text); }
    @media (max-width: 420px) { body { font-size: 18px; } main { width: 94vw; } .panel { padding: 28px 20px; } }
  </style>
</head>
<body>
  <main>
    <section class="panel center">
      <h1>PicMe</h1>
      <p>A party photo-guessing game where everyone plays.</p>
      <div class="actions">
        <a href="/host">Host a game</a>
        <a href="/play" class="secondary">Join a game</a>
      </div>
    </section>
  </main>
</body>
</html>
