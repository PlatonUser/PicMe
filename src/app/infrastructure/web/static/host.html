<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PicMe Host</title>
  <style>
    :root { color-scheme: dark; --bg: #10131a; --panel: #1b2130; --text: #f7f8fb; --muted: #b9c1d1; --accent: #ffd447; --danger: #ff7777; --line: #46516a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 20px/1.4 system-ui, sans-serif; }
    main { width: min(1200px, 94vw); margin: 0 auto; padding: 28px 0 60px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 2px solid var(--line); padding-bottom: 18px; }
    h1, h2, h3, p { margin: 0 0 18px; } h1 { font-size: clamp(2rem, 5vw, 4rem); letter-spacing: .03em; } h2 { font-size: clamp(2rem, 5vw, 4.5rem); line-height: 1.1; } h3 { font-size: 1.5rem; }
    .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: clamp(20px, 4vw, 42px); margin-top: 28px; }
    .center { text-align: center; } .stack > * { margin-bottom: 18px; } .stack > :last-child { margin-bottom: 0; }
    button, select, input { font: inherit; min-height: 58px; border-radius: 10px; border: 2px solid var(--line); padding: 10px 18px; }
    button { cursor: pointer; background: var(--accent); color: #17130a; border-color: var(--accent); font-weight: 800; } button:hover { filter: brightness(1.08); } button:disabled { cursor: wait; opacity: .55; }
    button.secondary { background: transparent; color: var(--text); } button.danger { background: var(--danger); border-color: var(--danger); }
    select, input { background: #10131a; color: var(--text); width: 100%; } label { display: block; font-weight: 700; margin-bottom: 7px; }
    .actions, .durations { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; } .actions button { flex: 1 1 190px; }
    .durations button { background: transparent; color: var(--text); border-color: var(--line); } .durations button.selected { background: var(--accent); color: #17130a; border-color: var(--accent); }
    .code { font-size: clamp(4rem, 16vw, 11rem); font-weight: 900; line-height: 1; letter-spacing: .16em; color: var(--accent); }
    .join-link { overflow-wrap: anywhere; font-size: clamp(1.1rem, 3vw, 2rem); } .muted { color: var(--muted); } .message { background: #50342d; border: 2px solid #ff9c7e; color: #fff0e9; padding: 14px 18px; border-radius: 10px; margin-top: 20px; }
    .error { background: #632d37; border-color: #ff8996; } .hidden { display: none !important; } .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; list-style: none; padding: 0; } .players li { background: #283148; border-radius: 8px; padding: 12px 16px; font-size: 1.25rem; }
    .photo { display: block; max-width: 100%; max-height: 58vh; margin: 0 auto 24px; border-radius: 12px; object-fit: contain; } .countdown { font-size: clamp(3rem, 10vw, 7rem); font-weight: 900; color: var(--accent); line-height: 1; }
    .scoreboard { width: 100%; border-collapse: collapse; font-size: clamp(1.2rem, 3vw, 2rem); } .scoreboard th, .scoreboard td { text-align: left; padding: 12px 10px; border-bottom: 2px solid var(--line); } .scoreboard th { color: var(--accent); }
    .small-actions { display: flex; gap: 10px; } .small-actions button { min-height: 46px; padding: 6px 14px; font-size: .9em; }
    @media (max-width: 650px) { header { align-items: flex-start; flex-direction: column; } main { padding-top: 16px; } .panel { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>PicMe <span class="muted">Host</span></h1><div class="small-actions"><button id="new-game" class="secondary">New game</button></div></header>
    <div id="error" class="message error hidden" role="alert"></div>
    <section id="start" class="panel center stack"><h2>Ready to play?</h2><p class="muted">Create a game and put this screen on your projector.</p><button id="create-game">Create game</button></section>
    <section id="screen" class="hidden"></section>
  </main>
  <script>
    (() => {
      'use strict';
      const KEY = 'picme-host';
      const start = document.getElementById('start');
      const screen = document.getElementById('screen');
      const error = document.getElementById('error');
      let credentials = readCredentials();
      let state = null;
      let categories = [];
      let pollTimer;
      let countdownTimer;
      let messageTimer;
      let busy = false;
      let renderedKey = '';
      let selectedCategory = 'Shuffle';
      let customPrompt = '';
      let selectedDuration = 40;
      let lobbyElements = {};
      let renderedPhase = '';
      let lastStateMessage = '';

      function readCredentials() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (_) { return null; } }
      function saveCredentials(value) { credentials = value; localStorage.setItem(KEY, JSON.stringify(value)); }
      function clearCredentials() { credentials = null; localStorage.removeItem(KEY); state = null; stopTimers(); showStart(); }
      function stopTimers() { clearTimeout(pollTimer); clearInterval(countdownTimer); }
      function showStart() { stopTimers(); renderedKey = ''; lobbyElements = {}; start.classList.remove('hidden'); screen.classList.add('hidden'); screen.innerHTML = ''; }
      function showError(message) { clearTimeout(messageTimer); error.textContent = message; error.classList.remove('hidden'); messageTimer = setTimeout(clearError, 4000); }
      function clearError() { clearTimeout(messageTimer); error.textContent = ''; error.classList.add('hidden'); }
      function escape(value) { return String(value ?? '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
      async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        if (credentials && credentials.host_token) headers.set('X-Host-Token', credentials.host_token);
        if (options.body && !(options.body instanceof FormData)) headers.set('Content-Type', 'application/json');
        const response = await fetch(path, { ...options, headers });
        let data = null;
        try { data = await response.json(); } catch (_) { /* Empty success bodies are allowed. */ }
        if (!response.ok) throw new Error(data && data.detail ? data.detail : `Request failed (${response.status})`);
        return data;
      }
      async function action(path, options = {}) {
        if (busy) return;
        busy = true; clearError();
        try { await api(path, options); await poll(); return true; } catch (caught) { showError(caught.message); return false; } finally { busy = false; }
      }
      async function createGame() {
        if (busy) return; busy = true; clearError();
        try { const game = await api('/games', { method: 'POST' }); saveCredentials({ code: game.code, host_token: game.host_token, round_started: false }); await loadCategories(); await poll(); }
        catch (caught) { showError(caught.message); } finally { busy = false; }
      }
      async function loadCategories() { try { categories = await api('/prompts/categories'); } catch (caught) { showError(caught.message); } }
      async function poll() {
        if (!credentials) return showStart();
        try { state = await api(`/games/${encodeURIComponent(credentials.code)}/state`); render(); }
        catch (caught) { showError(caught.message); }
        pollTimer = setTimeout(poll, 1500);
      }
      function render() {
        start.classList.add('hidden'); screen.classList.remove('hidden');
        const phaseChanged = state.phase !== renderedPhase;
        if (phaseChanged) { renderedPhase = state.phase; clearError(); lastStateMessage = state.message || ''; }
        const round = state.round || {}, photo = state.photo || {};
        const key = `${state.phase}:${round.round_number || ''}:${photo.id || ''}`;
        if (key !== renderedKey) {
          renderedKey = key;
          stopCountdown();
          const renderers = { lobby: renderLobby, uploading: renderUploading, voting: renderVoting, reveal: renderReveal, scoreboard: renderScoreboard };
          (renderers[state.phase] || renderWaiting)();
        } else if (state.phase === 'lobby') {
          updateLobby();
        } else if (state.phase === 'uploading') {
          updateUploading();
        } else if (state.phase === 'voting') {
          updateVoting();
        }
        if (!phaseChanged && state.message && state.message !== lastStateMessage) { lastStateMessage = state.message; showError(state.message); }
        if (!state.message) lastStateMessage = '';
      }
      function panel(content) { screen.innerHTML = `<section class="panel">${content}</section>`; }
      function renderLobby() {
        const options = categories.map(category => `<option value="${escape(category.id)}">${escape(category.name)}</option>`).join('');
        panel(`<div class="center"><div class="muted">Join code</div><div class="code">${escape(state.code || credentials.code)}</div><p class="join-link">${escape(location.origin)}/play?code=${encodeURIComponent(state.code || credentials.code)}</p></div><h3 id="player-count"></h3><ul id="player-list" class="players"></ul><div class="stack"><label for="category">Prompt category</label><select id="category"><option value="Shuffle">Shuffle</option>${options}</select><label for="custom-prompt">Or write your own prompt</label><input id="custom-prompt" maxlength="200" placeholder="e.g. A perfect holiday photo"><div class="durations" aria-label="Round duration"><button data-duration="20">20 s</button><button data-duration="40">40 s</button><button data-duration="60">60 s</button></div><div class="actions"><button id="start-round">Start round</button>${credentials.round_started ? '<button id="end-game" class="danger">End game</button>' : ''}</div></div>`);
        lobbyElements = {
          playerCount: document.getElementById('player-count'), playerList: document.getElementById('player-list'),
          category: document.getElementById('category'), prompt: document.getElementById('custom-prompt'),
          durationButtons: [...document.querySelectorAll('[data-duration]')], start: document.getElementById('start-round')
        };
        lobbyElements.category.value = selectedCategory;
        lobbyElements.prompt.value = customPrompt;
        lobbyElements.durationButtons.forEach(button => {
          button.classList.toggle('selected', Number(button.dataset.duration) === selectedDuration);
          button.onclick = () => { selectedDuration = Number(button.dataset.duration); updateDurationButtons(); };
        });
        lobbyElements.category.onchange = () => { selectedCategory = lobbyElements.category.value; };
        lobbyElements.prompt.oninput = () => { customPrompt = lobbyElements.prompt.value; };
        lobbyElements.start.onclick = startRound;
        const end = document.getElementById('end-game'); if (end) end.onclick = () => action(`/games/${credentials.code}/end`, { method: 'POST' });
        updateLobby();
      }
      function updateLobby() {
        if (!lobbyElements.playerList) return;
        const players = state.players || [];
        lobbyElements.playerCount.textContent = `Players (${players.length})`;
        const waiting = players.length === 0;
        while (lobbyElements.playerList.children.length < (waiting ? 1 : players.length)) {
          lobbyElements.playerList.appendChild(document.createElement('li'));
        }
        while (lobbyElements.playerList.children.length > (waiting ? 1 : players.length)) {
          lobbyElements.playerList.lastElementChild.remove();
        }
        if (waiting) {
          const item = lobbyElements.playerList.firstElementChild;
          item.className = 'muted';
          item.textContent = 'Waiting for players...';
        } else {
          players.forEach((player, index) => {
            const item = lobbyElements.playerList.children[index];
            item.className = '';
            item.textContent = player.name;
          });
        }
        lobbyElements.start.disabled = players.length < 2;
        const formFocused = document.activeElement === lobbyElements.category || document.activeElement === lobbyElements.prompt;
        if (formFocused) return;
        updateDurationButtons();
        lobbyElements.category.value = selectedCategory;
        lobbyElements.prompt.value = customPrompt;
      }
      function updateDurationButtons() {
        (lobbyElements.durationButtons || []).forEach(button => button.classList.toggle('selected', Number(button.dataset.duration) === selectedDuration));
      }
      async function startRound() {
        customPrompt = lobbyElements.prompt.value;
        selectedCategory = lobbyElements.category.value;
        const custom = customPrompt.trim();
        const category = selectedCategory;
        const duration = selectedDuration;
        const body = custom ? { prompt: custom, duration } : { category, duration };
        if (await action(`/games/${credentials.code}/rounds`, { method: 'POST', body: JSON.stringify(body) })) { credentials.round_started = true; localStorage.setItem(KEY, JSON.stringify(credentials)); }
      }
      function renderUploading() {
        const round = state.round || {}; panel(`<div class="center"><div class="muted">Prompt</div><h2>${escape(round.prompt)}</h2><div id="countdown" class="countdown">--</div><p>Uploaded <strong id="uploaded-count">${round.uploaded_count || 0}</strong> of <strong id="upload-player-count">${(state.players || []).length}</strong> players</p><div class="actions"><button id="extend">+10 s</button><button id="close-uploads" class="secondary">Close uploads</button></div></div>`);
        document.getElementById('extend').onclick = () => action(`/games/${credentials.code}/rounds/current/extend`, { method: 'POST' });
        document.getElementById('close-uploads').onclick = () => action(`/games/${credentials.code}/rounds/current/close`, { method: 'POST' });
        startCountdown(round);
      }
      function updateUploading() { const round = state.round || {}; document.getElementById('uploaded-count').textContent = round.uploaded_count || 0; document.getElementById('upload-player-count').textContent = (state.players || []).length; }
      function stopCountdown() { clearInterval(countdownTimer); }
      function startCountdown(round) {
        const deadline = Date.parse(round.upload_deadline); const server = Date.parse(round.server_time || new Date().toISOString()); const offset = Date.now() - server;
        const update = () => { const seconds = Math.max(0, Math.ceil((deadline - (Date.now() - offset)) / 1000)); const target = document.getElementById('countdown'); if (target) target.textContent = `${seconds}s`; };
        update(); countdownTimer = setInterval(update, 250);
      }
      function renderVoting() {
        const photo = state.photo || {}; const voting = state.voting || {};
        panel(`<div class="center"><img class="photo" src="/photos/${encodeURIComponent(photo.id)}/image" alt="Current anonymous photo"><h2>Photo ${photo.position} of ${photo.total}</h2><p>Voted <strong id="voted-count">${voting.voted || 0}</strong> of <strong id="eligible-count">${voting.eligible || 0}</strong></p><button id="close-voting">Close voting</button></div>`);
        document.getElementById('close-voting').onclick = () => action(`/games/${credentials.code}/voting/close`, { method: 'POST' });
      }
      function updateVoting() { const voting = state.voting || {}; document.getElementById('voted-count').textContent = voting.voted || 0; document.getElementById('eligible-count').textContent = voting.eligible || 0; }
      function renderWaiting() { panel('<section class="panel"><h2>Waiting...</h2></section>'); }
      function renderReveal() {
        const photo = state.photo || {}; const last = Number(photo.position) >= Number(photo.total);
        panel(`<div class="center"><img class="photo" src="/photos/${encodeURIComponent(photo.id)}/image" alt="Revealed photo"><h2>Taken by ${escape(photo.uploader_name || 'Unknown')}</h2><div class="actions">${last ? '<button id="back-lobby">Back to lobby</button><button id="end-game" class="danger">End game</button>' : '<button id="next-photo">Next photo</button>'}</div></div>`);
        if (last) { document.getElementById('back-lobby').onclick = () => action(`/games/${credentials.code}/lobby`, { method: 'POST' }); document.getElementById('end-game').onclick = () => action(`/games/${credentials.code}/end`, { method: 'POST' }); }
        else document.getElementById('next-photo').onclick = () => action(`/games/${credentials.code}/photos/next`, { method: 'POST' });
      }
      async function renderScoreboard() {
        panel('<div class="center"><h2>Scoreboard</h2><p class="muted">Loading results...</p></div>');
        const firstPlayer = state.players && state.players[0];
        if (!firstPlayer) return showError('No players are available for the scoreboard.');
        try { const result = await api(`/games/${credentials.code}/scoreboard?player_id=${encodeURIComponent(firstPlayer.id)}`); const rows = (result.players || []).map(player => `<tr><td>${escape(player.rank)}</td><td>${escape(player.name)}</td><td>${escape(player.points)}</td></tr>`).join(''); panel(`<div class="center"><h2>Scoreboard</h2></div><table class="scoreboard"><thead><tr><th>Rank</th><th>Player</th><th>Points</th></tr></thead><tbody>${rows}</tbody></table><div class="actions" style="margin-top:24px"><button id="play-again">Play again</button></div>`); document.getElementById('play-again').onclick = () => action(`/games/${credentials.code}/play-again`, { method: 'POST' }); } catch (caught) { showError(caught.message); }
      }
      document.getElementById('create-game').onclick = createGame;
      document.getElementById('new-game').onclick = clearCredentials;
      if (credentials && credentials.code && credentials.host_token) { loadCategories().finally(poll); } else showStart();
    })();
  </script>
</body>
</html>
